name: web

on:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - name: Gerar o editor
        run: python3 web/build.py
      - name: Instalar dependências dos testes
        working-directory: web/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Testes (auditoria, construtor e interface)
        working-directory: web/tests
        run: node run.js
      - uses: actions/upload-artifact@v4
        with:
          name: EditorXSL-Promob
          path: web/dist/EditorXSL-Promob.html
